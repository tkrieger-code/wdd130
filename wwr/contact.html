<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | South Rafting</title>
    <meta name="author" content="Tatiane Krieger">
    <meta name="description"
      content="Questions or to schedule an appointment? Contact South Rafting and discover the best of rafting and nature with our expert team.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img class="logo" src="images/z-wwr-crossedoars.png" alt="South Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="contact-info">
            <h1>South Rafting</h1>
            <address>
                6303 Av. Farroupilha<br>
                Canoas, Rio Grande do Sul<br>
                +1 999 999 9999<br>
                info@southrafting.com
            </address>
        </section>
        <section class="contact-main-grid">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1729.3585494138158!2d-51.16794186148494!3d-29.90125116857783!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95196fe2892d19cf%3A0x50b2eff7847f74ef!2sAv.%20Farroupilha%2C%206303%20-%20Igara%2C%20Canoas%20-%20RS%2C%2092410-305!5e0!3m2!1spt-BR!2sbr!4v1775770179043!5m2!1spt-BR!2sbr"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form class="contact-form">
                <div class="form-item">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="user-name" placeholder="Your complete name">
                </div>
                <div class="form-item">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="user-email" placeholder="your@email.com">
                </div>
                <fieldset>
                    <legend>Message Purpose</legend>
                    <label><input type="radio" name="purpose" value="general">General
                        Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation">Reservation
                        Question</label>
                    <label><input type="radio" name="purpose" value="suggestion">Website
                        Suggestion</label>
                </fieldset>
                <div class="form-item">
                    <label for="message">Message:</label>
                    <textarea id="message" name="user-message" rows="4"
                      placeholder="Type here"></textarea>
                </div>
                <div class="form-checkbox">
                    <input type="checkbox" id="newsletter" name="subscribe">
                    <label for="newsletter">Please Subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </section>
        <section class="employee-profiles">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.png" alt="Employee-Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.png" alt="Employee-Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.png" alt="Employee-Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 🏞 South Rafting 🏞 Tatiane Krieger</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="Linkedin Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
